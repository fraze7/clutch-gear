<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Headset Stand">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1b2030"/><stop offset="1" stop-color="#0b0d12"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3444"/><stop offset="1" stop-color="#1f2430"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b25"/><stop offset="1" stop-color="#232938"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3346"/><stop offset="0.5" stop-color="#1a2030"/><stop offset="1" stop-color="#303a50"/>
    </linearGradient>
    <pattern id="grip" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#1f2430"/><circle cx="5" cy="5" r="2" fill="#2d3444"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="430" rx="340" ry="300" fill="url(#glow)"/>
  <ellipse cx="400" cy="700" rx="260" ry="28" fill="#000000" opacity="0.35"/>
  
    <rect x="260" y="610" width="280" height="40" rx="14" fill="url(#body)" stroke="#3b4356" stroke-width="4"/>
    <rect x="382" y="250" width="36" height="370" rx="10" fill="#2d3444" stroke="#3b4356" stroke-width="3"/>
    <path d="M300,260 C300,190 500,190 500,260" stroke="#2d3444" stroke-width="30" fill="none" stroke-linecap="round"/>
    <rect x="300" y="620" width="30" height="14" rx="3" fill="#34d399"/><rect x="340" y="620" width="30" height="14" rx="3" fill="#34d399"/>
    <line x1="382" y1="330" x2="418" y2="330" stroke="#34d399" stroke-width="6"/>
</svg>
