name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # postinstall runs `prisma generate`, which doesn't need a database connection
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No `npm run build` here: it prerenders pages from the database, so it runs on Vercel,
      # which has the DATABASE_URL secrets
